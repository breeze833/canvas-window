name: CI & GitHub Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node test/canvas-window.test.js

  release:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create release archives
        run: |
          npm pack
          tar -czvf canvas-window.tar.gz src types SPEC.md README.md AGENTS.md LICENSE package.json
          zip -r canvas-window.zip src types SPEC.md README.md AGENTS.md LICENSE package.json

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ### canvas-window ${{ github.ref_name }}

            Automated package release for `${{ github.ref_name }}`.

            #### Installation
            ```bash
            npm install github:breeze833/canvas-window#${{ github.ref_name }}
            ```

            #### Assets
            - **`canvas-window.tar.gz`**: Standalone window UI, input coordinator, and protocol definitions.
            - **`canvas-window.zip`**: Zip archive for direct inclusion in web projects.
            - **`canvas-window-*.tgz`**: Standard npm-compatible package tarball.
          files: |
            canvas-window.tar.gz
            canvas-window.zip
            canvas-window-*.tgz
          make_latest: true
          target_commitish: ${{ github.sha }}

